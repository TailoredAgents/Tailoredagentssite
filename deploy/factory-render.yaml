# Opt-in deployment: not included in the main Blueprint, so normal web deploys
# cannot silently create a new paid service. One scheduled builder serves all sites.
services:
  - type: cron
    name: tailored-agents-website-builder
    runtime: docker
    branch: main
    # Match the existing CRM database's private network.
    region: ohio
    dockerfilePath: ./deploy/factory-builder.Dockerfile
    dockerContext: .
    # Chromium QA benefits from memory headroom; billed only while this job runs.
    plan: 1c-2g
    schedule: "*/5 * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FACTORY_OPENAI_API_KEY
        sync: false
      # Reuse the existing builder; point at the separate Render preview/storage service.
      - key: FACTORY_STORAGE_URL
        sync: false
      - key: FACTORY_STORAGE_SECRET
        sync: false
      - key: FACTORY_PREVIEW_ORIGIN
        sync: false
      - key: FACTORY_PREVIEW_SECRET
        sync: false
