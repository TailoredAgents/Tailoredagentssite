<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tailored Agents · Appearance review</title><style>*{box-sizing:border-box}html{color-scheme:light;--canvas:#e2e8f0;--panel:#edf2f7;--ink:#172334;--muted:#4e6078;--line:#bbc8d8;--blue:#2d5bd1}html[data-theme=dark]{color-scheme:dark;--canvas:#111827;--panel:#1b2638;--ink:#e4ebf5;--muted:#a8b6cb;--line:#40516b;--blue:#7fa6ff}body{margin:0;padding:24px;background:var(--canvas);color:var(--ink);font:15px/1.5 system-ui}header{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:24px;letter-spacing:-.04em;margin:0}p{margin:4px 0;color:var(--muted)}nav{display:flex;flex-wrap:wrap;gap:8px}button,nav a{font:inherit;padding:9px 14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{outline:2px solid var(--blue);outline-offset:1px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}figure{margin:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}figcaption{padding:10px 12px;font-size:14px;font-weight:600;display:flex;justify-content:space-between}figure a{display:block}img{display:block;width:100%;height:auto}small{color:var(--muted);font-weight:400}footer{margin-top:24px;color:var(--muted)}footer a{color:var(--blue)}body.sheet header nav,body.sheet footer{display:none}@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){body{padding:16px}main{grid-template-columns:minmax(0,1fr)}}</style><header><div><h1>Tailored Agents · Appearance</h1><p id="summary"></p></div><nav aria-label="Appearance comparisons"><button data-key="theme" data-value="light">Light · Slate & blue</button><button data-key="theme" data-value="dark">Dark · Midnight blue</button><button data-key="profile" data-value="desktop">Desktop</button><button data-key="profile" data-value="phone">Phone</button><a href="../../DASHBOARD_APPEARANCE.md">Release notes</a></nav></header><main></main><footer>Populated examples: <span id="providers"></span></footer><script>const names=["activity","analytics","calling-lists","client-detail","clients","contact-detail","email-workspace","inbox","lead-detail","leads","mockups","my-day","overview","project-detail","projects","sales-board","sales-detail","sales-table","settings","site-detail","sites","sms-workspace"],q=new URLSearchParams(location.search),theme=q.get('theme')==='dark'?'dark':'light',profile=q.get('profile')==='phone'?'phone':'desktop',sheet=q.get('sheet');document.documentElement.dataset.theme=theme;document.body.className=sheet?'sheet':'';document.querySelector('#summary').textContent=(theme==='dark'?'Midnight blue':'Slate & blue')+' · '+profile+' · synthetic local records';const selected=sheet?names.slice((Number(sheet)-1)*12,Number(sheet)*12):names;document.querySelector('main').innerHTML=selected.map(name=>'<figure><figcaption>'+name.replaceAll('-',' ')+'<small>'+theme+'</small></figcaption><a href="'+theme+'/'+name+'-'+profile+'.png"><img alt="'+name+' '+theme+' '+profile+'" src="'+theme+'/'+name+'-'+profile+'.png"></a></figure>').join('');document.querySelector('#providers').innerHTML=['conversations','inbox','sms','voice-active','voice'].map(name=>'<a href="'+theme+'/providers/'+name+'-'+profile+'.png">'+name.replaceAll('-',' ')+'</a>').join(' · ');document.querySelectorAll('button[data-key]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.value===(button.dataset.key==='theme'?theme:profile)));button.addEventListener('click',()=>{q.set(button.dataset.key,button.dataset.value);q.delete('sheet');location.search=q.toString()})});</script></html>
