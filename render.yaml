databases:
  - name: tailored-agents-db
    databaseName: tailored_agents
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: tailored-agents-web
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://tailoredagents.com
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tailored-agents-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://tailoredagents.com
      - key: DASHBOARD_ALLOWED_EMAILS
        sync: false
