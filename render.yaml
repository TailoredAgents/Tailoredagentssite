databases:
  - name: tailored-agents-db
    databaseName: tailored_agents
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: tailored-agents-web
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run db:migrate && npm run db:retention && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.tailoredagents.com
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tailored-agents-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://www.tailoredagents.com
      # Configure mail mode only after deploying Mail migration 0036 and its
      # DASHBOARD_AUTH_SECRET. Website migration 0007 is applied by the build.
      - key: DASHBOARD_AUTH_MODE
        sync: false
      - key: MAIL_AUTH_URL
        value: https://mail.tailoredagents.com/api/dashboard-auth
      - key: MAIL_AUTH_SECRET
        sync: false
      - key: DASHBOARD_ALLOWED_EMAILS
        sync: false
      - key: DASHBOARD_INITIAL_PASSWORD
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET
        sync: false
      - key: SEARCH_CONSOLE_SYNC_SECRET
        generateValue: true

  - type: cron
    name: tailored-agents-search-console-sync
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    # Review runtime cost before applying this change to the existing job.
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: npm run search-console:sync
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: SEARCH_CONSOLE_SYNC_URL
        value: https://www.tailoredagents.com/api/cron/search-console
      - key: SEARCH_CONSOLE_SYNC_SECRET
        fromService:
          name: tailored-agents-web
          type: web
          envVarKey: SEARCH_CONSOLE_SYNC_SECRET
